name: Validate and publish clean product URLs
on:
  pull_request:
    paths:
      - 'products/**'
      - 'scripts/build_clean_product_urls.py'
      - 'scripts/build_clean_content_urls.py'
      - 'lighting-guide/**'
      - 'blog/**'
      - 'manuals.js'
      - 'recommendations.js'
      - '.github/workflows/clean-product-urls.yml'
      - 'scripts/audit_site_integrity.py'
      - 'scripts/build_clean_project_urls.py'
      - 'scripts/normalize_public_site.py'
      - 'scripts/optimize_product_seo.py'
      - 'scripts/remove_blog_pdf_dates.py'
      - 'projects/**'
      - 'articles/**'
      - 'app.js'
      - 'index.html'
      - 'sitemap.xml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-clean-product-urls
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate real folder pages
        run: python3 scripts/build_clean_product_urls.py
      - name: Generate clean Lighting Guide and Blog URLs
        run: python3 scripts/build_clean_content_urls.py
      - name: Import supplied Oceanz by Danube images and preserve existing gallery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, urllib.request
          
          media = Path('projects/media')
          media.mkdir(parents=True, exist_ok=True)
          images = {
              'oceanz-lounge-and-dining.jpg': 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Kzi6Z3eHIprnbmmQYww4fd92cG/df84577f-02df-4fa3-8da9-80bbf5f36bdb.jpg',
              'oceanz-bedroom.jpg': 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Kzi6Z3eHIprnbmmQYww4fd92cG/16d701bc-e30c-42e8-a316-073580c30709.jpg',
              'oceanz-lift-lobby.jpg': 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Kzi6Z3eHIprnbmmQYww4fd92cG/43c27f95-3a2b-4cbd-a86b-df88dff00539.jpg',
              'oceanz-bathroom.jpg': 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Kzi6Z3eHIprnbmmQYww4fd92cG/d61128b2-b53f-46f9-b944-06b18a902035.jpg',
              'oceanz-pool.jpg': 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Kzi6Z3eHIprnbmmQYww4fd92cG/699ce921-c3d1-4f6f-b4fd-26811911c834.jpg',
              'oceanz-balcony.jpg': 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Kzi6Z3eHIprnbmmQYww4fd92cG/df616672-f280-47c3-aa9b-28f57dc85bbd.jpg',
              'oceanz-night-exterior.jpg': 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Kzi6Z3eHIprnbmmQYww4fd92cG/300e77fa-f14c-460a-bda4-2919a935b1b0.jpg',
          }
          for filename, url in images.items():
              dest = media / filename
              if dest.exists() and dest.stat().st_size > 10000 and dest.read_bytes()[:3] == b'\xff\xd8\xff':
                  continue
              req = urllib.request.Request(url, headers={'User-Agent': 'OMEGALUX-site-import/1.0'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  data = response.read()
              if len(data) < 10000 or not data.startswith(b'\xff\xd8\xff'):
                  raise RuntimeError(f'Invalid downloaded JPEG: {filename}')
              dest.write_bytes(data)
              print('Imported', filename, len(data))
          
          source = Path('projects/index.html')
          html = source.read_text(encoding='utf-8')
          pattern = re.compile(r'(<script id="project-data" type="application/json">)(.*?)(</script>)', re.S)
          match = pattern.search(html)
          assert match, 'Project data missing'
          projects = json.loads(match.group(2))
          oceanz = next(p for p in projects if p.get('id') == 'oceanz')
          def add_view(area_name, title, filename):
              area = next((a for a in oceanz['areas'] if a['name'] == area_name), None)
              if area is None:
                  area = {'name': area_name, 'views': []}
                  oceanz['areas'].append(area)
              render = 'media/' + filename
              if not any(v.get('render') == render for v in area['views']):
                  area['views'].append({
                      'title': title,
                      'render': render,
                      'map': '',
                      'pair': False,
                      'renderPage': None,
                      'mapPage': None,
                  })
          add_view('Facade lighting concept', 'Oceanz by Danube · illuminated night exterior', 'oceanz-night-exterior.jpg')
          add_view('Signature interiors', 'Oceanz by Danube · lounge and dining', 'oceanz-lounge-and-dining.jpg')
          add_view('Signature interiors', 'Oceanz by Danube · sea-view bedroom', 'oceanz-bedroom.jpg')
          add_view('Signature interiors', 'Oceanz by Danube · lift lobby', 'oceanz-lift-lobby.jpg')
          add_view('Signature interiors', 'Oceanz by Danube · bathroom', 'oceanz-bathroom.jpg')
          add_view('Waterfront amenities', 'Oceanz by Danube · infinity pool', 'oceanz-pool.jpg')
          add_view('Waterfront amenities', 'Oceanz by Danube · waterfront balconies', 'oceanz-balcony.jpg')
          new_data = json.dumps(projects, ensure_ascii=False, separators=(',', ':')).replace('<', '\\u003c')
          updated = html[:match.start(2)] + new_data + html[match.end(2):]
          if updated != html:
              source.write_text(updated, encoding='utf-8')
          print('Oceanz by Danube project views:', sum(len(a['views']) for a in oceanz['areas']))
          PY
      - name: Generate direct Project detail pages
        run: python3 scripts/build_clean_project_urls.py
      - name: Install PDF text inspection dependency
        run: python3 -m pip install --disable-pip-version-check pymupdf
      - name: Remove publication dates from Blog PDF footers
        run: python3 scripts/remove_blog_pdf_dates.py
      - name: Normalize site-wide navigation, canonical URLs and date displays
        run: python3 scripts/normalize_public_site.py
      - name: Apply product SEO metadata without changing page bodies or assets
        run: python3 scripts/optimize_product_seo.py
      - name: Confirm Products cover is preserved and All Products has its own URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cover=Path('products/index.html').read_text()
          catalogue_file=Path('products/all-products/index.html')
          assert '<section class="cover">' in cover, 'Original Products cover hero missing'
          assert 'media/editorial/cover.webp' in cover, 'Original hero image missing'
          assert 'The Alabaster' in cover and 'Browse by category' in cover
          assert 'href="/products/all-products/"' in cover, 'All products navigation missing'
          assert Path('products/media/editorial/cover.webp').is_file()
          assert catalogue_file.is_file(), 'All products listing is missing'
          listing=catalogue_file.read_text()
          assert 'All products' in listing and '<base href="/products/">' in listing
          assert '<section class="cover">' not in listing, 'Cover and listing routes mixed'
          print('PASS: Curated Products cover and separate All Products listing preserved')
          PY
      - name: Strict full-site audit of links, canons and undated downloads
        run: python3 scripts/audit_site_integrity.py --strict
      - name: Verify project deep-link routing and shared JavaScript syntax
        run: |
          node --check projects/projects.js
          node --check products/collection.js
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('projects')
          p=json.loads(re.search(r'<script[^>]*id=["\x27]project-data["\x27][^>]*>([\s\S]*?)</script>',(root/'index.html').read_text()).group(1))
          pages=list(root.glob('*/index.html'))
          assert len(pages)==len(p),(len(pages),len(p))
          for page in pages:
              html=page.read_text()
              url='https://www.omegaluxstudio.com/projects/'+page.parent.name+'/'
              assert '<base href="/projects/">' in html
              assert '<link rel="canonical" href="'+url+'">' in html
          print('PASS: Project deep-link pages and JavaScript syntax validated')
          PY
      - name: Validate Vein Globe direct URL and shared assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('products/table-lamps/Vein-Globe/index.html')
          assert p.exists(), 'Missing Vein Globe folder URL'
          s=p.read_text()
          assert '<base href="/products/">' in s
          assert 'https://www.omegaluxstudio.com/products/table-lamps/Vein-Globe/' in s
          assert 'media/editorial/' in s
          assert Path('products/collection.js').exists()
          assert Path('products/collection.css').exists()
          assert Path('index.html').exists()
          print('Nested clean URL and relative asset routing validated')
          PY
      - name: Persist verified canonical site pages to the repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'OMEGALUX site maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Maintain clean project and product URLs and undated editorial files [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: '.'
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete site to Pages
        id: deployment
        uses: actions/deploy-pages@v4
